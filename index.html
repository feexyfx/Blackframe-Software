<style>
:root{--bg:#f5f2ec;--card:#fffdf9;--ink:#151413;--mute:#7b766c;--line:#ddd7cb;--gold:#8a6d3b;--red:#a6372c;--ok:#4d7a58;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0b;--card:#111113;--ink:#f2efe9;--mute:#8d8a84;--line:#26262a;--gold:#b8a074;--red:#e0766b;--ok:#8fb996;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0b;--card:#111113;--ink:#f2efe9;--mute:#8d8a84;--line:#26262a;--gold:#b8a074;--red:#e0766b;--ok:#8fb996;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Jost,system-ui,sans-serif}
h1,h2,h3,.big{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;margin:0;font-variant-numeric:lining-nums}
h2{font-size:30px}h3{font-size:21px;margin-bottom:10px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;max-width:1240px;margin:auto}
aside{padding:30px 22px;border-right:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);align-self:start}
.logo{position:relative;padding:24px 6px 22px;text-align:center;line-height:1}
.logo b{display:block;font-weight:300;letter-spacing:.36em;font-size:15px;margin-right:-.36em}
.logo small{display:block;font-weight:300;letter-spacing:.5em;font-size:8px;margin:9px -.5em 0 0}
.logo::before,.logo::after{content:"";position:absolute;left:0;right:0;height:30%;border:1px solid currentColor;opacity:.75}
.logo::before{top:0;border-bottom:0}.logo::after{bottom:0;border-top:0}
nav{display:flex;flex-direction:column;margin:34px 0 26px}
nav a{padding:9px 0 9px 14px;color:var(--mute);text-decoration:none;border-left:1px solid var(--line);display:flex;justify-content:space-between;letter-spacing:.02em}
nav a:hover{color:var(--ink)}nav a[aria-current=page]{color:var(--ink);border-left-color:var(--gold)}
#badge{color:var(--red);font-size:13px}
main{padding:34px 38px;min-width:0}
button,input,select{font:inherit;color:var(--ink)}
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);padding:9px 18px;cursor:pointer;letter-spacing:.03em}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:3px 11px;font-size:13px}aside .btn{width:100%;margin-bottom:8px}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
a{color:var(--gold)}.card{border:1px solid var(--line);background:var(--card);padding:24px;margin-bottom:20px}
.hero{padding:40px 34px}.hero .big{font-size:clamp(46px,8vw,84px);line-height:1.05}.hero p{color:var(--mute);margin:6px 0 22px}
.split{display:flex;height:2px;background:var(--line)}.split i{display:block;height:100%}
.legend{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px;color:var(--mute);font-size:14px}.legend b{color:var(--ink);font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;margin-bottom:20px;border:1px solid var(--line);background:var(--card)}
.kpis div{padding:20px 22px;border-right:1px solid var(--line)}.kpis span{display:block;color:var(--mute);font-size:13px}.kpis b{font:500 30px "Cormorant Garamond",serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.banner{display:block;padding:12px 18px;margin-bottom:22px;border:1px solid var(--gold);color:var(--ink);text-decoration:none}.banner.warn{border-color:var(--red);color:var(--red)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mute);font-weight:400;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:lining-nums tabular-nums}tr.tot td{font-weight:500;border-top:1px solid var(--ink);border-bottom:0}
tr.rv td{color:var(--mute);text-decoration:line-through}tr.rv td.keep{text-decoration:none}
.st{font-size:13px}.st.overdue{color:var(--red)}.st.paid{color:var(--ok)}.st.soon{color:var(--gold)}.st.void{color:var(--mute)}
.bar{height:2px;background:var(--gold);min-width:2px}.empty{text-align:center;padding:40px 12px;color:var(--mute)}
.chart{display:flex;gap:6px;height:190px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:0}
.chart .col{flex:1;display:flex;flex-direction:column;height:100%;justify-content:flex-end;align-items:center}
.bars{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}.bars i{display:block;width:38%;background:var(--ink);min-height:1px}.bars i.x{background:var(--gold);opacity:.7}
.mlab{display:flex;gap:6px;color:var(--mute);font-size:12px;margin-top:6px}.mlab span{flex:1;text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.g2 .card{margin:0}
dialog{border:1px solid var(--line);background:var(--card);color:var(--ink);width:min(560px,94vw);padding:28px;max-height:92vh}dialog::backdrop{background:rgba(0,0,0,.65)}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 5px}
input,select{width:100%;padding:9px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ln{display:grid;grid-template-columns:3fr 1fr 2fr;gap:10px}.hide{display:none!important}
.err{color:var(--red);min-height:20px;margin:12px 0 0}.note{font-size:13px;color:var(--mute)}
.filters{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:20px}.filters div{min-width:140px}
.paper{background:#fff;color:#111;max-width:780px;margin:0 auto;padding:54px;border:1px solid var(--line)}.paper .logo{width:210px;margin-bottom:34px}
.paper table td,.paper table th{border-color:#ddd;color:#111}.paper .note{color:#666}.paper .g2{gap:30px}.paper h2{font-size:38px;margin-bottom:18px}
.stamp{display:inline-block;border:1px solid #4d7a58;color:#4d7a58;padding:3px 14px;letter-spacing:.2em;font-size:12px;margin-left:12px;vertical-align:middle}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;border:0;border-bottom:1px solid var(--line);padding:16px}nav{flex-direction:row;overflow-x:auto;margin:16px 0}nav a{border:0;border-bottom:1px solid var(--line);padding:8px 12px}main{padding:18px}.row,.g2{grid-template-columns:1fr}.paper{padding:24px}}
@media print{aside,.noprint,.banner{display:none!important}.app{display:block}body{background:#fff}main{padding:0}.paper{border:0;padding:0}}

th,td{white-space:normal;overflow-wrap:anywhere}.tw{overflow:visible}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
.app{grid-template-columns:var(--sw,240px) 1fr}.app.col{--sw:76px}

.bellw{position:relative;margin-left:auto}.pop{position:absolute;right:0;top:48px;width:min(380px,92vw);background:var(--card);border:1px solid var(--line);z-index:70;max-height:70vh;overflow:auto}
.pop a{display:block;padding:13px 16px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;border-left:2px solid transparent}.pop a.late{border-left-color:var(--red)}.pop a.soon,.pop a.info{border-left-color:var(--gold)}
.pop h4{margin:0;padding:14px 16px;font:500 20px "Cormorant Garamond",serif;border-bottom:1px solid var(--line)}
.inv{display:grid;grid-template-columns:1fr auto;gap:4px 20px;padding:20px 0;border-bottom:1px solid var(--line)}.inv:last-child{border:0}.ia{text-align:right}.amt{font:500 26px "Cormorant Garamond",serif}
.ib{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
.li{display:flex;justify-content:space-between;gap:12px;margin-top:14px}.pb{height:2px;background:var(--line);margin-top:5px}.pb i{display:block;height:2px;background:var(--gold)}
.chart .bars i{min-height:0}.kpis{gap:1px;background:var(--line)}.kpis div{background:var(--card);border:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;z-index:90;max-width:92vw}.ov{display:none}
.paper{--ink:#111;--mute:#666;--line:#ddd;--card:#fff;--gold:#8a6d3b;--red:#a6372c;--ok:#4d7a58;color-scheme:light;background:#fff;color:#111}.paper .logo{width:auto;max-width:100%;display:inline-block;padding:24px 28px 22px}.paper .logo b{font-size:14px;letter-spacing:.3em;margin-right:-.3em;overflow-wrap:anywhere}
@media(max-width:800px){.app,.app.col{grid-template-columns:1fr}.bm{display:block;width:34px;height:34px}.hm{display:none}.inv{grid-template-columns:1fr}.ia{text-align:left}
aside,.col aside{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:80;background:var(--bg);transform:translateX(-100%);border:0;border-right:1px solid var(--line);padding:calc(22px + env(safe-area-inset-top,0px)) 22px 22px;overflow-y:auto}
.nav-open aside{transform:none}.nav-open .ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:75}.col .logo,.col .lbl{display:block}.col .lbl{display:inline}.col .mark,.col .pl{display:none}.col #src{display:block}.col nav a{justify-content:flex-start;padding-left:14px;border-left:1px solid var(--line)}
nav{flex-direction:column;overflow:visible}.paper{padding:22px}}
@media print{.bar,.toast{display:none!important}}

<dialog id="dlg"><form id="f" method="dialog">
<h2>New entry</h2>
<label for="kind">What happened?</label>
<select id="kind"><option value="channel_revenue">Own channel revenue received</option><option value="client_revenue">Client revenue (your cut) received</option>
<option value="client_funds_in">Money received for a client</option><option value="client_funds_out">Paid out to a client</option>
<option value="expense">Expense</option><option value="draw">Owner draw</option><option value="capital">Share capital paid in</option></select>
<div class="row"><div><label for="date">Date</label><input type="date" id="date" required></div>
<div><label for="amount">Amount</label><input id="amount" inputmode="decimal" placeholder="0.00" required></div></div>
<div class="row"><div><label for="cur">Currency</label><select id="cur"><option>NGN</option><option>USD</option></select></div>
<div id="rateW" class="hide"><label for="rate">Rate (₦ per $1)</label><input id="rate" inputmode="decimal" placeholder="1500"></div></div>
<div id="clientW" class="hide"><label for="client">Client</label><input id="client" list="clients" autocomplete="off"><datalist id="clients"></datalist></div>
<div id="chanW"><label for="chan">YouTube channel</label><input id="chan" list="chans" autocomplete="off"><datalist id="chans"></datalist></div>
<div id="expW" class="hide"><div class="row"><div><label for="cat">Category</label><select id="cat"></select></div>
<div><label for="pct">Business use %</label><input id="pct" value="100" inputmode="decimal"></div></div>

</form></dialog>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n<0?'-':'')+(Math.abs(n)/100).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const N=n=>'₦'+fmt(n),today=()=>new Date().toISOString().slice(0,10);
const ACC={1000:['Bank & cash','asset'],1200:['WHT credit (tax prepaid)','asset'],2000:['Client funds held','liability'],2100:['VAT payable','liability'],3000:['Share capital','equity'],3100:['Owner draws','equity'],4000:['Own channel revenue','revenue'],4100:['Client revenue','revenue'],5100:['Equipment','expense'],5200:['Software & subscriptions','expense'],5300:['Editors & freelancers','expense'],5400:['Phone & internet','expense'],5500:['Transport','expense'],5600:['Rent & office','expense'],5700:['Marketing & ads','expense'],5800:['Bank & stamp duty fees','expense'],5900:['Other','expense']};
const KIND={channel_revenue:'Channel revenue',client_revenue:'Client revenue',client_funds_in:'Client money in',client_funds_out:'Client payout',expense:'Expense',draw:'Owner draw',capital:'Share capital',invoice_payment:'Invoice payment'};
let entries=[],invs=[],cols=null,cfg={id:'main',name:'',rc:'',addr:'',email:'',bank:'',vat:7.5,logo:'',setup:false};
const save=()=>{try{localStorage.setItem('bfb2',JSON.stringify({entries,invs,cfg}))}catch(_){}};
try{const s=JSON.parse(localStorage.getItem('bfb2')||localStorage.getItem('bfb')||'null');if(Array.isArray(s))entries=s;else if(s){entries=s.entries||[];invs=s.invs||[];cfg={...cfg,...s.cfg}}}catch(_){}
function put(k,o){const a=k==='entries'?entries:invs,i=a.findIndex(x=>x.id===o.id);i<0?a.push(o):a[i]=o;save();if(cols)cols[k].doc(o.id).set(o).catch(()=>{})}
function putCfg(){save();if(cols)cols.settings.doc('main').set(cfg).catch(()=>{})}
function del(k,id){const a=k==='entries'?entries:invs,i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);save();if(cols)cols[k].doc(id).delete().catch(()=>{})}
// ---- ledger core (integer kobo, same rules as the Python version) ----
function dec(s,dp){s=String(s).replace(/[,\s₦$]/g,'');if(!/^\d*\.?\d+$|^\d+\.?$/.test(s))throw Error('Enter a valid number.');let[a,b='']=s.split('.');b=(b+'0'.repeat(dp)).slice(0,dp+1);let v=BigInt(a||0)*10n**BigInt(dp)+BigInt(b.slice(0,dp)||0);if(+b[dp]>=5)v+=1n;return v}
function build(k,f){
 const o=dec(f.amount,2),usd=f.cur==='USD';let ngn=o;
 if(usd){if(!f.rate)throw Error('Enter the exchange rate for USD.');ngn=(o*dec(f.rate,4)+5000n)/10000n}
 ngn=Number(ngn);if(ngn<=0)throw Error('Amount must be more than zero.');
 const B=1000,c=f.client||null,h=f.chan||null;let L;
 if(['client_revenue','client_funds_in','client_funds_out'].includes(k)&&!c)throw Error('Enter the client’s name.');
 if(k==='channel_revenue')L=[[B,ngn,0,null,h],[4000,0,ngn,null,h]];
 else if(k==='client_revenue')L=[[B,ngn,0,c,null],[4100,0,ngn,c,null]];
 else if(k==='client_funds_in')L=[[B,ngn,0,c,null],[2000,0,ngn,c,null]];
 else if(k==='client_funds_out')L=[[2000,ngn,0,c,null],[B,0,ngn,c,null]];
 else if(k==='draw')L=[[3100,ngn,0,null,null],[B,0,ngn,null,null]];
 else if(k==='capital')L=[[B,ngn,0,null,null],[3000,0,ngn,null,null]];
 else{const p=parseFloat(f.pct);if(!(p>=0&&p<=100))throw Error('Business use must be between 0 and 100.');
  const biz=Math.round(ngn*p/100);L=[];if(biz)L.push([+f.cat,biz,0,null,null]);if(ngn-biz)L.push([3100,ngn-biz,0,null,null]);L.push([B,0,ngn,null,null])}
 if(L.reduce((s,l)=>s+l[1],0)!==L.reduce((s,l)=>s+l[2],0))throw Error('Entry does not balance.');
 return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:f.date,kind:k,memo:f.memo||KIND[k],cur:f.cur,orig:usd?Number(o):null,rate:usd?f.rate:null,reverses:null,created:new Date().toISOString(),amt:ngn,lines:L}}
function reversal(e){return{...e,id:Date.now().toString(36)+'r',memo:'Reversal: '+e.memo,reverses:e.id,date:new Date().toISOString().slice(0,10),created:new Date().toISOString(),lines:e.lines.map(l=>[l[0],l[2],l[1],l[3],l[4]])}}
const reversed=()=>new Set(entries.filter(e=>e.reverses).map(e=>e.reverses));
function bal(start='0000',end='9999'){const m={};for(const k in ACC)m[k]={code:k,name:ACC[k][0],type:ACC[k][1],d:0,c:0};
 for(const e of entries)if(e.date>=start&&e.date<=end)for(const l of e.lines){m[l[0]].d+=l[1];m[l[0]].c+=l[2]}return Object.values(m)}
function pnl(s,e,by){const r=bal(s,e);const rev=r.filter(x=>x.type==='revenue').reduce((a,x)=>a+x.c-x.d,0),exp=r.filter(x=>x.type==='expense').reduce((a,x)=>a+x.d-x.c,0);
 const g={};for(const en of entries)if(en.date>=s&&en.date<=e)for(const l of en.lines)if(ACC[l[0]][1]==='revenue'){const k=l[by==='client'?3:4]||'(unassigned)';g[k]=(g[k]||0)+l[2]-l[1]}
 return{rev,exp,profit:rev-exp,split:Object.entries(g).sort((a,b)=>b[1]-a[1])}}
function sheet(end){const r=bal('0000',end),s=(t,sg)=>r.filter(x=>x.type===t).reduce((a,x)=>a+sg*(x.d-x.c),0);
 const earn=-r.filter(x=>['revenue','expense'].includes(x.type)).reduce((a,x)=>a+x.d-x.c,0),A=s('asset',1),Lb=s('liability',-1),Eq=s('equity',-1);return{A,Lb,Eq,earn,chk:A-(Lb+Eq+earn)}}
// ---- helpers ----
const M=(n,c)=>c==='USD'?'$'+fmt(n):N(n),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const tot=l=>{const o={};l.forEach(i=>o[i.cur]=(o[i.cur]||0)+i.total);const k=Object.keys(o);return k.length?k.map(c=>M(o[c],c)).join(' + '):N(0)};
const addD=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const plabel=(ps,k)=>k==='yearly'?ps.slice(0,4):new Date(ps+'T00:00:00Z').toLocaleString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
const nextPs=(ps,k)=>{const d=new Date(ps+'T00:00:00Z');k==='yearly'?d.setUTCFullYear(d.getUTCFullYear()+1):d.setUTCMonth(d.getUTCMonth()+1);return d.toISOString().slice(0,10)};
const stat=i=>i.paid?'paid':i.due<today()?'overdue':dd(i.due,today())<=7?'due soon':'pending';

 return{entries:j.entries,invs:j.invoices,cfg:{id:'main',name:t('name'),rc:t('rc'),addr:t('addr'),email:t('email'),bank:t('bank'),vat:Math.min(100,Math.max(0,+s.vat||0)),logo,setup:true}}}
